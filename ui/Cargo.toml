[package]
name = "grandhonor-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
grandhonor-core = { path = "../crates/core" }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.61.3", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "=3.0.12"
