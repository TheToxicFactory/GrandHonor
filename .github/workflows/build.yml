name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
      - name: Build
        run: ./build.ps1
      - name: Test
        run: cargo test -p grandhonor-core -p grandhonor-panel --locked
      - name: Install Inno Setup
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
            throw 'Inno Setup checksum mismatch.'
          }
          $install = Start-Process $setup -ArgumentList '/VERYSILENT /CURRENTUSER /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup returned $($install.ExitCode)." }
      - name: Build installer
        run: ./installer/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GrandHonor-win-x64
          path: |
            dist/GrandHonor-Setup-x64.exe
            dist/GrandHonor-win-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = [regex]::Match((Get-Content -Raw Cargo.toml), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (!$version -or $tag -ne "v$version") { throw "Version tag does not match Cargo.toml." }
          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $published = ($existing | ConvertFrom-Json).assets.name
            foreach ($file in 'GrandHonor-Setup-x64.exe', 'GrandHonor-win-x64.zip') {
              if ($file -notin $published) { throw "Existing release is missing $file." }
            }
          } else {
            # Only this version's changes: the first section of RELEASE_NOTES.md, which must be
            # headed "# GrandHonor <version>"; earlier versions stay out of the release text.
            $lines = Get-Content RELEASE_NOTES.md -Encoding UTF8
            if ($lines[0] -ne "# GrandHonor $version") { throw "RELEASE_NOTES.md does not start with # GrandHonor $version." }
            $end = 1
            while ($end -lt $lines.Count -and $lines[$end] -notmatch '^#{1,2} ') { $end++ }
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            [IO.File]::WriteAllText($notes, (($lines[1..($end - 1)] -join "`n").Trim() + "`n"), [Text.UTF8Encoding]::new($false))
            gh release create $tag dist\GrandHonor-Setup-x64.exe dist\GrandHonor-win-x64.zip `
              --title "GrandHonor $tag" `
              --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed ($LASTEXITCODE)." }
